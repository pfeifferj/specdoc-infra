---
apiVersion: v1
kind: PersistentVolume
metadata:
  finalizers:
  - kubernetes.io/pv-protection
  labels:
    app: hedgedoc
  name: hedgedoc-uploads-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 8Gi
  claimRef:
    kind: PersistentVolumeClaim
    name: hedgedoc
    namespace: hedgedoc
  hostPath:
    path: /var/data/hedgedoc/uploads
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
  storageClassName: customer-workload-storage
  volumeMode: Filesystem
