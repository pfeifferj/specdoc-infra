---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"spec-board:latest","namespace":"hedgedoc"},"fieldPath":"spec.template.spec.containers[?(@.name==\"spec-board\")].image","pause":"false"}]'
  labels:
    app: hedgedoc
    component: spec-board
  name: spec-board
  namespace: hedgedoc
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: hedgedoc
      component: spec-board
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hedgedoc
        component: spec-board
    spec:
      containers:
      - env:
        - name: PGHOST
          value: hedgedoc-postgres
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: hedgedoc
        - name: PGUSER
          value: hedgedoc
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: CMD_DB_PASSWORD
              name: spec-board
        - name: HEDGEDOC_BASE_URL
          value: https://md.josie.cloud
        - name: SPEC_BOARD_BASE_URL
          value: https://specs.josie.cloud
        - name: NAMESPACES
          value: pfeifferj/hedgedoc-spec,netfyr/specs
        - name: DEFAULT_NAMESPACE
          value: pfeifferj/hedgedoc-spec
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: GITHUB_TOKEN
              name: spec-board
              optional: true
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              key: GITHUB_APP_ID
              name: spec-board
              optional: true
        - name: GITHUB_APP_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              key: GITHUB_APP_PRIVATE_KEY
              name: spec-board
              optional: true
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              key: WEBHOOK_URL
              name: spec-board
              optional: true
        - name: SMTP_HOST
          value: witcher.mxrouting.net
        - name: SMTP_PORT
          value: '465'
        - name: SMTP_SECURE
          value: 'true'
        - name: SMTP_FROM
          value: void@josie.cloud
        - name: PRIVACY_CONTACT
          value: privacy@josie.cloud
        - name: EMAIL_DEBOUNCE_MINUTES
          value: '30'
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              key: SMTP_USER
              name: spec-board
              optional: true
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              key: SMTP_PASS
              name: spec-board
              optional: true
        - name: BOARD_OAUTH_CLIENT_ID
          value: Ov23liOjRfZjJgQJHokc
        - name: BOARD_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: BOARD_OAUTH_CLIENT_SECRET
              name: spec-board
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              key: SESSION_SECRET
              name: spec-board
        - name: BOARD_ADMINS
          value: pfeifferj
        image: image-registry.openshift-image-registry.svc:5000/hedgedoc/spec-board@sha256:6c0019fd834eaee66656356c53c3ba555064b86b262378a14d4671cef9e83182
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: spec-board
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: hedgedoc
    component: spec-board
  name: spec-board
  namespace: hedgedoc
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: hedgedoc
    component: spec-board
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    route.openshift.io/termination: edge
  labels:
    app: hedgedoc
    component: spec-board
  name: spec-board
  namespace: hedgedoc
spec:
  ingressClassName: openshift-default
  rules:
  - host: specs.josie.cloud
    http:
      paths:
      - backend:
          service:
            name: spec-board
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - specs.josie.cloud
    secretName: spec-board-tls
