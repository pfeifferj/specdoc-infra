---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hedgedoc
    component: postgres
  name: hedgedoc-postgres
  namespace: hedgedoc
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: hedgedoc
      component: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hedgedoc
        component: postgres
    spec:
      containers:
      - env:
        - name: POSTGRESQL_USER
          value: hedgedoc
        - name: POSTGRESQL_DATABASE
          value: hedgedoc
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: CMD_DB_PASSWORD
              name: hedgedoc-postgres
        image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /usr/libexec/check-container
            - --live
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: postgresql
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /usr/libexec/check-container
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/pgsql/data
          name: data
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: master-0
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hedgedoc-postgres
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: hedgedoc
    component: postgres
  name: hedgedoc-postgres
  namespace: hedgedoc
spec:
  ports:
  - port: 5432
    protocol: TCP
    targetPort: 5432
  selector:
    app: hedgedoc
    component: postgres
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  finalizers:
  - kubernetes.io/pvc-protection
  name: hedgedoc-postgres
  namespace: hedgedoc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  storageClassName: customer-workload-storage
  volumeName: hedgedoc-postgres-pv
---
apiVersion: v1
data:
  CMD_DB_DATABASE: hedgedoc
  CMD_DB_DIALECT: postgresql
  CMD_DB_HOST: hedgedoc-postgres
  CMD_DB_PORT: '5432'
  CMD_DB_USERNAME: hedgedoc
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: hedgedoc
    app.kubernetes.io/name: hedgedoc
  name: hedgedoc-database
  namespace: hedgedoc
