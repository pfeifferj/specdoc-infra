# Namespace-local mirrors of the build base images. Every build on this cluster
# pulls Docker Hub anonymously from one shared egress IP, so without these the
# rate limit is a build outage waiting to happen. referencePolicy: Local also
# pins the digest each build resolved.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: node
  namespace: hedgedoc
spec:
  tags:
    - name: 24-bookworm
      from:
        kind: DockerImage
        name: docker.io/library/node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
      referencePolicy:
        type: Local
      importPolicy:
        scheduled: true
    - name: 24-bookworm-slim
      from:
        kind: DockerImage
        name: docker.io/library/node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
      referencePolicy:
        type: Local
      importPolicy:
        scheduled: true
    - name: 24-alpine
      from:
        kind: DockerImage
        name: docker.io/library/node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
      referencePolicy:
        type: Local
      importPolicy:
        scheduled: true
